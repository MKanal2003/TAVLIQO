services:
  - type: web
    name: tavliqo
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn qrdine.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CONTROL_DATABASE_URL
        fromDatabase:
          name: tavliqo-control-db
          property: connectionString
      - key: TENANT_DATABASE_URL
        fromDatabase:
          name: tavliqo-tenant-db
          property: connectionString

databases:
  - name: tavliqo-control-db
    databaseName: qrdine_control
    user: tavliqo
  - name: tavliqo-tenant-db
    databaseName: qrdine_tenant
    user: tavliqo
{% extends "base_staff.html" %}
{% block title %}Take Order — TAVLIQO{% endblock %}

{% block staff_content %}
<div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
  
  <!-- Left: Menu Items -->
  <div class="flex-1">
    <div class="mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="flex gap-2 overflow-x-auto w-full pb-2">
        <button onclick="filterCat('all', this)" class="category-btn active bg-[#0B1D42] text-white px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap">All</button>
        {% for cat in categories %}
        <button onclick="filterCat('{{ cat.pk }}', this)" class="category-btn bg-white border border-gray-200 text-[#0B1D42] px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap">{{ cat.name }}</button>
        {% endfor %}
      </div>
      <input type="text" id="search" placeholder="Search..." class="w-full sm:w-64 px-4 py-2 border border-gray-200 rounded-xl text-sm focus:border-[#0BA6A0] outline-none">
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4" id="item-grid">
      {% for item in menu_items %}
      <button type="button" onclick="addToCart({{ item.id }}, '{{ item.name }}', {{ item.price }}, this)" 
              class="item-card bg-white border border-gray-200 rounded-2xl p-3 text-left hover:border-[#0BA6A0] hover:shadow-md transition-all active:scale-95"
              data-category="{{ item.category_id|default:'none' }}" data-name="{{ item.name|lower }}">
        {% if item.image %}
        <img src="{{ item.image.url }}" class="w-full h-24 object-cover rounded-xl mb-3">
        {% else %}
        <div class="w-full h-24 bg-gray-100 rounded-xl mb-3 flex items-center justify-center"><span class="text-xs text-gray-400">No Image</span></div>
        {% endif %}
        <p class="font-bold text-[#0B1D42] text-sm truncate">{{ item.name }}</p>
        <p class="text-[#0BA6A0] font-bold text-sm">₹{{ item.price }}</p>
      </button>
      {% endfor %}
    </div>
  </div>

  <!-- Right: Sticky Cart -->
  <div class="w-full md:w-80 flex-shrink-0">
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-lg sticky top-6">
      <h3 class="font-heading font-bold text-[#0B1D42] text-lg mb-4">Current Order</h3>
      
      <form method="post" id="order-form">
        {% csrf_token %}
        <input type="hidden" name="items_json" id="items_json">
        
        <div class="space-y-3 mb-6">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Table / Location</label>
            <input type="text" name="table_label" required placeholder="e.g. Table 5, Car 2"
                   class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:border-[#0BA6A0] outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Payment Mode</label>
            <select name="payment_intent" class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:border-[#0BA6A0] outline-none">
              <option value="CASH">Cash</option>
              <option value="ONLINE">UPI / Online</option>
            </select>
          </div>
        </div>

        <div id="cart-items" class="space-y-2 mb-4 max-h-60 overflow-y-auto pr-2">
          <!-- JS will inject cart items here -->
          <p class="text-sm text-gray-400 text-center py-4" id="empty-cart-msg">Tap items to add them</p>
        </div>

        <div class="border-t border-gray-100 pt-4 flex items-center justify-between mb-4">
          <span class="font-medium text-gray-500">Total</span>
          <span class="text-xl font-heading font-bold text-[#0B1D42]" id="cart-total">₹0</span>
        </div>

        <button type="submit" class="w-full bg-[#0BA6A0] text-white font-bold py-3 rounded-xl hover:bg-[#098b86] transition-colors shadow-lg shadow-[#0BA6A0]/30">
          Send to Kitchen
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  let cart = {};
  
  function addToCart(id, name, price, btn) {
    if (!cart[id]) cart[id] = { name, price, qty: 0 };
    cart[id].qty += 1;
    renderCart();
    
    // Visual feedback on tile
    btn.classList.add('border-[#0BA6A0]', 'ring-2', 'ring-[#0BA6A0]/20');
    setTimeout(() => btn.classList.remove('border-[#0BA6A0]', 'ring-2', 'ring-[#0BA6A0]/20'), 300);
  }
  
  function updateQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    const emptyMsg = document.getElementById('empty-cart-msg');
    const totalEl = document.getElementById('cart-total');
    const hiddenInput = document.getElementById('items_json');
    
    container.innerHTML = '';
    let total = 0;
    let itemIds = [];
    
    if (Object.keys(cart).length === 0) {
      container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Tap items to add them</p>';
      totalEl.textContent = '₹0';
      hiddenInput.value = '';
      return;
    }

    for (const [id, item] of Object.entries(cart)) {
      total += item.price * item.qty;
      itemIds.push(id); // For backend form parsing
      
      const div = document.createElement('div');
      div.className = 'flex items-center justify-between bg-gray-50 p-2 rounded-lg text-sm';
      div.innerHTML = `
        <div class="flex-1 truncate pr-2">
          <p class="font-medium text-[#0B1D42] truncate">${item.name}</p>
          <p class="text-xs text-gray-500">₹${item.price}</p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="updateQty(${id}, -1)" class="w-6 h-6 bg-white border border-gray-200 rounded text-gray-600">-</button>
          <span class="font-bold w-4 text-center">${item.qty}</span>
          <button type="button" onclick="updateQty(${id}, 1)" class="w-6 h-6 bg-white border border-gray-200 rounded text-gray-600">+</button>
        </div>
      `;
      container.appendChild(div);
    }
    
    totalEl.textContent = '₹' + total.toFixed(2);
    
    // We need to submit the form in the format the backend expects: item_ids and qty_X
    // Since Django forms are tricky with dynamic names, we'll append hidden inputs dynamically on submit
  }

  // Handle Form Submission
  document.getElementById('order-form').addEventListener('submit', function(e) {
    if (Object.keys(cart).length === 0) {
      e.preventDefault();
      alert("Please add items to the order first.");
      return;
    }
    
    // Append hidden inputs for items and qty
    for (const [id, item] of Object.entries(cart)) {
      const itemInput = document.createElement('input');
      itemInput.type = 'hidden';
      itemInput.name = 'items';
      itemInput.value = id;
      this.appendChild(itemInput);

      const qtyInput = document.createElement('input');
      qtyInput.type = 'hidden';
      qtyInput.name = `qty_${id}`;
      qtyInput.value = item.qty;
      this.appendChild(qtyInput);
    }
  });

  // Filters
  document.getElementById('search').addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll('.item-card').forEach(card => {
      const match = card.dataset.name.includes(query);
      card.style.display = match ? 'block' : 'none';
    });
  });

  function filterCat(catId, btn) {
    document.querySelectorAll('.category-btn').forEach(b => {
      b.classList.remove('bg-[#0B1D42]', 'text-white');
      b.classList.add('bg-white', 'text-[#0B1D42]', 'border', 'border-gray-200');
    });
    btn.classList.remove('bg-white', 'text-[#0B1D42]', 'border', 'border-gray-200');
    btn.classList.add('bg-[#0B1D42]', 'text-white');

    document.querySelectorAll('.item-card').forEach(card => {
      if (catId === 'all' || card.dataset.category === catId) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  }
</script>
{% endblock %}

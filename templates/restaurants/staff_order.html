{% extends "base_staff.html" %}
{% block title %}Take Order — TAVLIQO{% endblock %}
{% block staff_content %}
<form method="post" class="max-w-4xl mx-auto">
    {% csrf_token %}
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-white p-6 rounded-2xl border border-[#E7E7E0]">
            <label class="block text-sm font-medium text-[#0B1D42] mb-2">Table Number *</label>
            <input type="text" name="table_label" required placeholder="e.g. 5 or Terrace 2" 
                   class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-[#0BA6A0] focus:ring-1 focus:ring-[#0BA6A0] outline-none">
        </div>
        
        <div class="bg-white p-6 rounded-2xl border border-[#E7E7E0]">
            <label class="block text-sm font-medium text-[#0B1D42] mb-2">Payment Mode</label>
            <select name="payment_intent" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-[#0BA6A0] focus:ring-1 focus:ring-[#0BA6A0] outline-none">
                <option value="CASH">Cash</option>
                <option value="ONLINE">UPI / Online</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-[#E7E7E0] p-6 mb-6">
        <h3 class="text-lg font-semibold text-[#0B1D42] mb-4">Select Items</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for item in menu_items %}
            <div class="flex items-center justify-between p-4 border border-gray-100 rounded-xl bg-gray-50">
                <div class="flex items-center gap-3">
                    <input type="checkbox" name="items" value="{{ item.id }}" id="item_{{ item.id }}" 
                           class="w-5 h-5 text-[#0BA6A0] rounded focus:ring-[#0BA6A0] cursor-pointer">
                    <label for="item_{{ item.id }}" class="cursor-pointer">
                        <p class="font-medium text-[#0B1D42]">{{ item.name }}</p>
                        <p class="text-sm text-gray-500">₹{{ item.price }}</p>
                    </label>
                </div>
                <div class="w-20">
                    <input type="number" name="qty_{{ item.id }}" value="1" min="1" 
                           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-center focus:border-[#0BA6A0] outline-none">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="flex gap-4">
        <a href="{% url 'restaurants:staff_dashboard' %}" class="w-1/3 bg-gray-200 text-[#0B1D42] font-semibold py-4 rounded-xl text-center hover:bg-gray-300 transition-colors">Cancel</a>
        <button type="submit" class="w-2/3 bg-[#0BA6A0] text-white font-semibold py-4 rounded-xl hover:bg-[#098b86] transition-colors shadow-lg shadow-[#0BA6A0]/30 text-lg">
            Send Order to Kitchen
        </button>
    </div>
</form>
{% endblock %}

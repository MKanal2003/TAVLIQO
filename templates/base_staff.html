{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Staff Panel — TAVLIQO{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #FAF8F5; color: #14110F; }
    .font-heading { font-family: 'Fraunces', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="antialiased">

  <!-- Top Bar -->
  <header class="bg-[#14110F] text-[#FAF8F5] border-b border-[#2A2420] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xl font-heading font-bold tracking-tight">
          TAVLIQ<span class="text-[#C85A17]">O</span>
        </span>
        <span class="px-2.5 py-0.5 bg-[#C85A17]/20 text-[#F3A26D] border border-[#C85A17]/30 text-[11px] font-bold rounded-full uppercase tracking-wider">Staff Mode</span>
      </div>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="text-xs sm:text-sm font-medium text-[#A89F96] hover:text-white flex items-center gap-2 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Exit
        </button>
      </form>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6">
    {% block staff_content %}{% endblock %}
  </main>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAVLIQO Control Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #14110F; color: #FAF8F5; }
        .font-heading { font-family: 'Fraunces', serif; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 antialiased">

    <div class="max-w-4xl w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-heading font-extrabold tracking-tight mb-2">
                TAVLIQ<span class="text-[#C85A17]">O</span>
                <span class="text-xs font-mono-num bg-[#C85A17]/20 text-[#F3A26D] border border-[#C85A17]/40 px-2.5 py-1 rounded-full align-top ml-2 tracking-wider">INTERNAL</span>
            </h1>
            <p class="text-sm text-[#A89F96]">Undisclosed Access Portal. Keep this URL restricted to authorized operators.</p>
        </div>

        <div class="grid md:grid-cols-3 gap-6">

            <!-- Super Admin -->
            <a href="{% url 'accounts:login' %}" class="bg-[#1D1916] border border-white/10 p-8 rounded-2xl hover:bg-[#241F1B] hover:border-[#C85A17] transition-all text-center group shadow-sm">
                <div class="w-16 h-16 bg-[#C85A17]/15 border border-[#C85A17]/30 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-105 transition-transform">
                    <svg class="w-8 h-8 text-[#F3A26D]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <h2 class="text-lg font-heading font-bold text-[#FAF8F5] mb-1">Super Admin</h2>
                <p class="text-xs text-[#A89F96]">Platform Management</p>
            </a>

            <!-- Restaurant Admin -->
            <a href="{% url 'accounts:login' %}" class="bg-[#1D1916] border border-white/10 p-8 rounded-2xl hover:bg-[#241F1B] hover:border-[#C85A17] transition-all text-center group shadow-sm">
                <div class="w-16 h-16 bg-[#1E4D3B]/25 border border-[#1E4D3B]/40 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-105 transition-transform">
                    <svg class="w-8 h-8 text-[#8AD1B5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                </div>
                <h2 class="text-lg font-heading font-bold text-[#FAF8F5] mb-1">Restaurant Admin</h2>
                <p class="text-xs text-[#A89F96]">Owner Dashboard &amp; Menu</p>
            </a>

            <!-- Staff Login -->
            <div class="bg-[#1D1916] border border-white/10 p-8 rounded-2xl text-center shadow-sm">
                <div class="w-16 h-16 bg-[#C85A17]/15 border border-[#C85A17]/30 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-[#F3A26D]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </div>
                <h2 class="text-lg font-heading font-bold text-[#FAF8F5] mb-1">Staff Login</h2>
                <p class="text-xs text-[#A89F96] mb-4">Requires Restaurant Slug</p>

                <form onsubmit="window.location.href = '/accounts/staff-login/' + document.getElementById('slug').value + '/'; return false;" class="flex flex-col gap-2.5">
                    <input type="text" id="slug" placeholder="e.g. hotel-subedar" required
                           class="w-full px-3.5 py-2.5 bg-[#14110F] border border-white/15 rounded-xl text-xs font-mono-num text-[#FAF8F5] placeholder-[#7A7167] focus:border-[#C85A17] focus:ring-2 focus:ring-[#C85A17]/20 outline-none text-center transition-all">
                    <button type="submit" class="w-full bg-[#C85A17] hover:bg-[#A94910] text-white font-semibold text-xs py-2.5 rounded-xl transition-colors shadow-sm">
                        Go to Staff Login
                    </button>
                </form>
            </div>

        </div>

        <div class="mt-12 text-center">
            <a href="/" class="text-xs font-medium text-[#A89F96] hover:text-[#FAF8F5] transition-colors">← Back to Public Landing Page</a>
        </div>
    </div>
</body>
</html>
